global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/cc4c-alerts.yml

scrape_configs:
  - job_name: cc4c-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: cc4c_observer
      password_file: /run/secrets/management_password
    static_configs:
      - targets: ['backend:4081']
        labels:
          application: cc4c
          environment: compose

  - job_name: cc4c-rabbitmq
    metrics_path: /metrics/per-object
    basic_auth:
      username: cc4c_monitor
      password_file: /run/secrets/rabbit_monitor_password
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          application: cc4c
          environment: compose
    metric_relabel_configs:
      - source_labels: [vhost]
        regex: 'cc4c'
        action: keep
      - source_labels: [queue]
        regex: 'cc4c\\.v3\\.messaging\\.local\\..*'
        action: keep
