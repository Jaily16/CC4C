  <path d="M1378 495C1438 495 1438 823 1400 862" class="sync"/>
  <rect x="1348" y="782" width="112" height="24" rx="12" fill="#eef4ff"/>
  <text x="1361" y="800" font-size="15" class="blue">后端查询 API</text>
  <path d="M1289 844C1289 797 1270 792 1270 731" class="metric"/>
  <text x="1169" y="808" class="small green">抓取 Actuator</text>

