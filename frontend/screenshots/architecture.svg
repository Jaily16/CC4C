    <rect x="353" y="848" width="223" height="137" rx="22" fill="white"/>
    <rect x="666" y="848" width="224" height="137" rx="22" fill="white"/>
    <rect x="941" y="848" width="227" height="137" rx="22" fill="white"/>
    <rect x="1206" y="848" width="221" height="137" rx="22" fill="white"/>
  </g>
  <g class="icon" color="#5276aa">
    <ellipse cx="108" cy="876" rx="18" ry="7" fill="#eff5fc"/><path d="M90 876v28c0 10 36 10 36 0v-28M90 890c0 9 36 9 36 0"/>
  </g>
  <text x="142" y="889" class="h">MySQL</text>
  <text x="93" y="930" class="body muted">业务表 · Flyway</text>
  <text x="93" y="960" class="small muted">Outbox / Inbox</text>
  <g class="icon" color="#c26766"><path d="m377 878 19-9 19 9-19 9zM377 888l19 9 19-9M377 898l19 9 19-9"/></g>
  <text x="431" y="889" class="h">Redis</text>
  <text x="376" y="930" class="body muted">会话 · 缓存</text>
  <text x="376" y="960" class="small muted">三个 namespace</text>
  <g class="icon" color="#cf882e"><path d="M690 875h35v30h-35zM698 875v-10m14 10v-10m-14 23h6m8 0h6"/></g>
  <text x="737" y="889" class="h" style="font-size:22px">RabbitMQ</text>
  <text x="689" y="930" class="body muted">事件 · 消费确认</text>
  <text x="689" y="960" class="small muted">专用 vhost</text>
  <g class="icon" color="#ab7bba"><rect x="963" y="873" width="37" height="27" rx="3"/><path d="m964 875 18 14 17-14"/></g>
  <text x="1013" y="889" class="h">SMTP</text>
  <text x="964" y="930" class="body muted">验证码 · 通知</text>
  <text x="964" y="960" class="small muted">外部邮件服务</text>
  <g class="icon" color="#229486"><circle cx="1240" cy="885" r="17"/><path d="m1230 889 6-13 5 8 9-2"/></g>
  <text x="1266" y="889" class="h" style="font-size:21px">Prometheus</text>
