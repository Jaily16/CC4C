name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  container-performance:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run isolated container performance gate
        shell: pwsh
        run: ./scripts/performance/run-container-performance.ps1 -StandardRounds 3
      - name: Remove only the release performance project
        if: always()
        run: docker compose -p cc4c-perf --profile performance down --volumes --remove-orphans

  publish:
    needs: [quality, container-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate SemVer tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/jaily16/cc4c-${{ matrix.component }}"
          version="${GITHUB_REF_NAME#v}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:$version,$image:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
