spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://testcontainers-not-configured.invalid:3306/cc4c_test
    username: testcontainers
    password: testcontainers
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      url: redis://testcontainers-not-configured.invalid:6379
      connect-timeout: 2s
      timeout: 2s
  session:
    store-type: redis
    timeout: 2h
    redis:
      repository-type: indexed
      namespace: ${CC4C_TEST_REDIS_NAMESPACE:cc4c:test:manual}
  mail:
    username: test-sender@example.com
  rabbitmq:
    addresses: amqp://testcontainers:testcontainers@testcontainers-not-configured.invalid:5672/cc4c_test
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        concurrency: 1
        default-requeue-rejected: false
        missing-queues-fatal: false

cc4c:
  observability:
    enabled: false
    environment: test
    management-username: cc4c_test_observer
    management-password: cc4c-test-observer-password-not-secret
    messaging-sample-interval: 15s
    max-http-uri-tags: 100
  messaging:
    namespace: ${CC4C_TEST_RABBITMQ_NAMESPACE:cc4c.test.messaging.manual}
    active-key-id: test-v1
    payload-keys: test-v1=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    moderation-recipients: reviewer@example.com
    confirm-timeout: 2s
    consumer-retry-delays: 100ms,250ms,500ms
    poll-interval: 100ms
    dispatcher-enabled: false
    consumers-enabled: false
  cache:
    enabled: true
    redis-url: redis://testcontainers-not-configured.invalid:6379
    namespace: ${CC4C_TEST_CACHE_REDIS_NAMESPACE:cc4c:test:cache:manual}
    test-cleanup-enabled: true
  security:
    pepper: cc4c-functional-test-pepper-not-a-production-secret
    cookie-secure: false
    allowed-origins: http://localhost:5173
    bcrypt-strength: 4
    password-readiness-enabled: false
    redis-readiness-enabled: true
    key-prefix: ${CC4C_TEST_REDIS_NAMESPACE:cc4c:test:manual}:security
  test-controller-enabled: true
  save-img-path: ${user.dir}/target/functional-files/blog/
  request-img-path: http://localhost:5173/test-blog/
  save-avatar-path: ${user.dir}/target/functional-files/avatar/
  request-avatar-path: http://localhost:5173/test-avatar/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      show-details: when_authorized
      roles: OBSERVABILITY
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,securityRedis
        dependencies:
          include: businessCache,rabbit,asyncMessaging
      status:
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 200

logging:
  level:
    org.springframework.session.data.redis.RedisIndexedSessionRepository: ERROR
